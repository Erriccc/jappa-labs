# Open-source projects tracked by the digest.
# Want a project added? See https://github.com/Erriccc/jappa-labs/issues/6

built_for_west_africa:
  - repo: nyamebabaku-lab/efiewura
    category: property and rent
    description: Efie Wura Pro, rental management for Ghana with MoMo rent payments and owner payouts.
  - repo: akeoj/Nigeria-real-estate-price-prediction
    category: property and rent
    description: Machine learning models that estimate property prices from Nigerian listing data.
  - repo: thatmanfrancis/Hausevo
    category: property and rent
    description: Property listings, tenancy records and maintenance for the Nigerian rental market, starting from Lagos.
  - repo: amirofekiti/Nigeria-Land-Registry-Blockchain-Prototype
    category: land and title
    description: Research prototype using a blockchain as an audit layer for land registration in Nigeria.
  - repo: batestguy/crop-value-predictor
    category: farm and farm data
    description: Season Margin, an offline-first crop comparison tool for Nigerian farmers.
  - repo: aa-Teye/Prop_collect
    category: land and title
    description: PropCollect, a property rate collection and analytics system for Ghana.
  - repo: adeyanjufuhad/sowo
    category: messaging and handoff
    description: WhatsApp sales assistant for Nigerian vendors with Paystack payments and human takeover.
  - repo: Dakiss-dev/Shipping-hub
    category: diaspora shipping
    description: Package intake and shipment batches for diaspora shipping operators.
  - repo: Rexangels/RouteSure
    category: diaspora shipping
    description: Early-stage starter for Nigerian address validation, built around the NIPOST postcode API.
  - repo: Josephadebiyi/neringa
    category: diaspora shipping
    description: Bago, a peer-to-peer international package delivery platform matching senders with travellers, with KYC, escrow, and Stripe and Paystack payments.
  - repo: bajoski34/mcp-flutterwave
    category: prices and payments
    description: MCP server for the Flutterwave API, with tools for payment links, direct charges, transfers, virtual accounts, Nigerian bill payments, BVN and bank account checks, and NGN, GHS and USD FX trades. Also ships a browser chat app.
  - repo: zerotaldev/paystack-mcp
    category: prices and payments
    description: Early MCP server for Paystack in Nigeria, Ghana, South Africa, Kenya and Côte d'Ivoire that creates checkout links, verifies payments and lists transactions, with guards on live keys and amounts. The README notes checkout creation has not yet been tried with a real transaction.
  - repo: chimaobikanu/nigerian-reference-data-mcp
    category: identity and verification
    description: MCP client for a hosted pay-per-call API (USDC over x402) that format-checks NIN, BVN, TIN and CAC numbers, validates NUBAN account numbers and looks up phone networks. The checks run on the hosted service, not in this repo, and no identity database is queried.
  - repo: georgeonweb3/whatsapp-vendor-agent
    category: messaging and handoff
    description: Keyword-based WhatsApp sales bot demo for Nigerian vendors that answers price, stock and delivery-fee questions from a JSON catalogue and drafts orders. The README lists Paystack payment links; in the code the link is built from a URL pattern, not through the Paystack API, and replies are not yet sent back to WhatsApp.
  - repo: Obiajulu-gif/confirmly
    category: messaging and handoff
    description: Confirmly, a multi-merchant WhatsApp ordering app that uses an LLM to read orders from chat, prices them server-side, takes payment through Monnify and marks orders paid only after checking with Monnify's API. Set up for the Monnify sandbox.
  - repo: thechiddx3/nairalook
    category: prices and payments
    description: Nairalook, a Chrome extension and small API that scrape parallel and official naira rates for USD, GBP and EUR from a third-party rate site. The README calls the official rate the I&E window rate and says MIT licence; the code reads the site's CBN figure and the repo has no licence file.
  - repo: Emzy123/Naira-rate-api
    category: prices and payments
    description: Hackathon API that sells a USD/NGN rate from open.er-api.com, labelled official, and street rates from Quidax and Luno USDT/NGN tickers per call, paid in stablecoins on Celo over x402. Includes a Telegram bot client. The README says MIT licence, but the repo has no licence file.
  - repo: NOVIX37/NairaWise
    category: prices and payments
    description: NairaWise, a static USD to NGN converter in English and Hausa that shows the CBN reference rate (via the Frankfurter API) with its rate date and lets users enter a dealer's rate. No licence yet.
  - repo: acekyd/made-in-nigeria
    category: directories
    description: Community-curated list of open-source tools and projects built by Nigerian developers, with a companion website.

building_blocks:
  - repo: opengisch/QField
    category: land and title
    description: Mobile app for field mapping and surveys, built on QGIS.
  - repo: opengisch/QFieldCloud
    category: land and title
    description: Cloud service that syncs QField projects and field data.
  - repo: farmOS/farmOS
    category: farm and farm data
    description: Web-based farm record keeping and management.
  - repo: frappe/lending
    category: prices and payments
    description: Open-source lending and loan management software.
  - repo: getodk/collect
    category: farm and farm data
    description: Android app for collecting survey and field data offline.
  - repo: getodk/central
    category: farm and farm data
    description: Server for managing ODK forms and collected data.
  - repo: WFP-VAM/DataBridgesKnots
    category: prices and payments
    description: Get WFP market and food price data with Python, Stata or R.
  - repo: agstack/inatrace-backend
    category: farm and farm data
    description: Backend for INATrace, supply chain traceability for smallholder farmers and cooperatives.
  - repo: EvansSchoolPolicyAnalysisAndResearch/LSMS-Agricultural-Indicators-Code
    category: farm and farm data
    description: Code that builds agricultural indicators from LSMS household survey data.
  - repo: OCHA-DAP/hdx-scraper-wfp-foodprices
    category: prices and payments
    description: Publishes WFP food price data to the Humanitarian Data Exchange.
  - repo: MrObadiahEJ/terra
    category: land and title
    description: Terra, a blockchain-anchored land registry built on the ISO 19152 (LADM) standard.
  - repo: keanehatescoding/land-title-monitor
    category: land and title
    description: Land-title monitoring and verification service for Kenya. No licence yet.
  - repo: VROOM-Project/vroom
    category: pickup routing
    description: Vehicle-routing optimiser for pickups with time windows and capacity.
  - repo: GIScience/openrouteservice
    category: pickup routing
    description: Routing and isochrone API with route optimisation.
  - repo: fleetbase/fleetbase
    category: dispatch and portals
    description: Open logistics platform with dispatch, driver app and customer storefront.
  - repo: fleetbase/navigator-app
    category: dispatch and portals
    description: Open driver mobile app for the Fleetbase platform.
  - repo: calcom/cal.diy
    category: booking
    description: Open-source scheduling for booking pickup slots (formerly calcom/cal.com).
  - repo: alextselegidis/easyappointments
    category: booking
    description: Self-hosted appointment booking app.
  - repo: openboxes/openboxes
    category: warehouse and manifest
    description: Open-source inventory and shipment management.
  - repo: karrioapi/karrio
    category: shipping labels
    description: Self-hosted shipping API for rates and labels. Archived, tracked for reference.
  - repo: chatwoot/chatwoot
    category: messaging and handoff
    description: Shared inbox with a WhatsApp Cloud API channel and human handoff.
  - repo: activepieces/activepieces
    category: messaging and handoff
    description: Open workflow automation with WhatsApp, Stripe and Chatwoot pieces.
  - repo: n8n-io/n8n
    category: messaging and handoff
    description: Workflow automation with WhatsApp Cloud nodes (fair-code licence).
  - repo: openwallet-foundation/credo-ts
    category: identity and verification
    description: TypeScript framework for issuing, holding and verifying digital credentials.
  - repo: openwallet-foundation/acapy
    category: identity and verification
    description: Python agent for issuing and verifying verifiable credentials.
  - repo: inji/inji-verify
    category: identity and verification
    description: MOSIP's credential verifier with QR-based verification.
  - repo: inji/inji-wallet
    category: identity and verification
    description: MOSIP's wallet for national-ID credentials; Nigeria's national ID is moving to MOSIP.
  - repo: mosip/esignet
    category: identity and verification
    description: MOSIP's national-ID login service (OpenID Connect).
  - repo: smileidentity/smileid-sdk-js
    category: identity and verification
    description: Smile ID server SDK (JS/TS) for African identity and document checks.
  - repo: smileidentity/smileid-sdk-python
    category: identity and verification
    description: Smile ID server SDK (Python) for African identity and document checks.
  - repo: transparency-dev/tessera
    category: trust and chain of custody
    description: Library for tamper-evident logs, usable for seal and custody records.
  - repo: sigstore/rekor
    category: trust and chain of custody
    description: Signed, tamper-evident transparency log.
  - repo: OpenCerts/opencerts-website
    category: identity and verification
    description: Verifier for tamper-proof documents and certificates.
  - repo: mo3awia89/peer-to-peer-crowdshipping
    category: traveller carry
    description: Concept-stage plan for international crowdshipping with travellers, starting with Jordan to UAE. README only, no code or licence yet.
  - repo: thekiller23-hub/RouteMate
    category: traveller carry
    description: RouteMate, an early Django and React app matching delivery requests with travellers on the same route, with OTP handover and escrow.
  - repo: mahaurpiyush-bit/CarryLink
    category: traveller carry
    description: CarryLink, an early Spring Boot and React app that matches senders with travellers by route, timing and spare capacity.
  - repo: Abrahon/luggagelinker-backend
    category: traveller carry
    description: LuggageLinker backend, a Django REST API for matching package senders with travellers, with KYC, bookings, wallets and disputes. No README yet.
  - repo: munatsimike/carry4me
    category: diaspora shipping
    description: Carry4Me, an in-development web app for diaspora senders to send parcels home with travellers. Its code includes Supabase, Stripe and delivery-OTP integration; the README still describes it as frontend-first.
  - repo: cfandoh123/ParceFlyte
    category: traveller carry
    description: ParceFlyte, an early prototype matching parcels with travellers, with fee negotiation and KYC review. Payments and compliance checks are simulated.

own:
  - repo: Erriccc/jappa-labs
    category: open-source tools and research
    description: Jappa Labs, home of this digest, the send-to-nigeria plugin and the research behind them.
