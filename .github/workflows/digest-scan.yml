name: Digest scan

on:
  schedule:
    - cron: "0 6 * * *"  # daily, 06:00 UTC (issue #6)
  workflow_dispatch:

permissions:
  contents: read

env:
  DATA_DIR: digest/data

concurrency:
  group: digest-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Run scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 digest/scan.py >> "$GITHUB_STEP_SUMMARY"
          echo "DATA_FILE=$(ls -t "$DATA_DIR"/*.json | head -n 1)" >> "$GITHUB_ENV"  # the file just written

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: digest-data
          path: ${{ env.DATA_FILE }}
          if-no-files-found: error
          retention-days: 7

  commit:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: digest-data
          path: ${{ env.DATA_DIR }}

      - name: Commit data file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DATA_DIR"
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Digest scan data for $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
