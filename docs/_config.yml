title: Jappa Labs
description: Open-source tools and research for the West African diaspora.
url: "https://erriccc.github.io"
baseurl: "/jappa-labs"
theme: minima
github_username: Erriccc

# All of these are supported by the GitHub Pages build (.github/workflows/pages.yml).
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
  - jekyll-relative-links

# Digest editions are plain markdown with no front matter. The plugins above
# render them, take the title from the first heading, and turn relative .md
# links into page links. strip_title stops the heading showing twice.
titles_from_headings:
  strip_title: true

# Turn relative .md links in posts (docs/research/_posts) into page links too.
relative_links:
  collections: true

defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post-back
      back_url: /research/
      back_label: Research
  # Guide pages and digest editions get a "Back to ..." link
  # (_layouts/page-back.html, _includes/back-link.html).
  - scope:
      path: "guide"
    values:
      layout: page-back
      back_url: /guides.html
      back_label: Guides
  - scope:
      path: "digest"
    values:
      layout: page-back
      back_url: /digest/
      back_label: Digest

header_pages:
  - send-to-nigeria.md
  - guides.md
  - research/index.md
  - digest/index.md
  - open-work.md
  - skill.md
  - about.md
